# Explicit install phase. Railway's builder stopped injecting $NIXPACKS_UV_VERSION,
# so the default `pip install uv==$NIXPACKS_UV_VERSION` became `pip install uv==`
# (invalid) and broke every deploy. Pin the phase ourselves instead of relying on it.
# uv installs into /opt/venv; `uv sync` then creates the project venv at /app/.venv,
# which the start command uses.
[phases.setup]
nixPkgs = ["python312", "gcc"]

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv",
  ". /opt/venv/bin/activate && pip install uv && uv sync --no-dev --frozen",
]

[start]
cmd = "/app/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port $PORT"
