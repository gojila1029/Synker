name: Tests

on:
  push:
    branches: [main, synker-v1]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q
        env:
          SUPABASE_JWT_SECRET: test-secret-not-for-production
          DATABASE_URL: postgresql+asyncpg://test:test@localhost/test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "AI Knowledge Curation Platform"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        run: npm install -g pnpm@12.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test --run

