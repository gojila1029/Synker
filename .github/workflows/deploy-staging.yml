name: Deploy to Railway Staging

# Manual only. Railway's GitHub integration already deploys staging on every
# push to synker-v1; running this on push as well would double-deploy.
on:
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy backend to staging
        run: railway up --service adaptable-charm --environment staging --project 4c4a8694-f006-41f5-90c6-eadfdeadecb6 --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy frontend to staging
        run: railway up --service synker-frontend --environment staging --project 4c4a8694-f006-41f5-90c6-eadfdeadecb6 --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
